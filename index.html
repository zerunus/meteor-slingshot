<!DOCTYPE html>
<!-- Meteor Slingshot obfuscated build 2026-11-26T04:11:10.684Z -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>유성 슬링샷</title>
<style>
:root{
  --panel:rgba(13,18,43,.88);
  --line:rgba(255,255,255,.14);
  --text:#eef2ff;
  --muted:#9aa5d1;
  --accent:#ffd166;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;display:flex;align-items:center;justify-content:center;
  padding:16px;
  background:radial-gradient(1100px 650px at 50% -10%,#1c2552 0%,#0b1026 55%,#05070f 100%);
  color:var(--text);
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
#stage{position:relative;width:min(960px,100%)}
#game{
  display:block;width:100%;aspect-ratio:960/600;
  background:#0b1026;border-radius:14px;
  border:1px solid var(--line);
  box-shadow:0 24px 60px rgba(0,0,0,.55);
  touch-action:none;cursor:crosshair;
}
/* 상단 HUD 오버레이 */
#hud{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
.pill{
  background:var(--panel);border:1px solid var(--line);border-radius:999px;
  padding:6px 14px;font-size:14px;font-weight:600;letter-spacing:.02em;
  backdrop-filter:blur(4px);
}
.pill b{color:var(--accent);font-variant-numeric:tabular-nums;margin-left:4px}
#comboPill{border-color:rgba(255,209,102,.5);color:var(--accent)}
#comboPill.hidden{visibility:hidden}
/* 마을 내구도 바(잔량 색 변화 + 재생 중 발광) */
.vbar{position:relative;width:110px;height:10px;border-radius:999px;background:rgba(255,255,255,.16);overflow:hidden;margin-left:4px;vertical-align:middle;display:inline-block}
.vfill{position:absolute;inset:0;width:100%;border-radius:999px;background:#7ee08a;transition:width .25s,background-color .25s}
.vfill.mid{background:#ffd166}
.vfill.low{background:#ff6b57}
.vfill.regen{box-shadow:0 0 8px rgba(126,224,138,.85)}
/* 우측 상단 음소거 토글(오버레이 위 z-index로 타이틀 화면에서도 사용) */
#muteBtn{
  position:absolute;top:12px;right:12px;z-index:30;
  width:38px;height:38px;border-radius:50%;
  border:1px solid var(--line);background:var(--panel);
  color:var(--text);font-size:17px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(4px);
}
#muteBtn:hover{filter:brightness(1.18)}
#muteBtn:focus-visible{outline:2px solid #fff;outline-offset:3px}
/* 우하단 아이템 칩 바(플레이 중에만 표시) */
#itemBar{position:absolute;right:12px;bottom:12px;display:flex;gap:8px;z-index:20}
#itemBar.hidden{display:none}
.chip{
  display:inline-flex;align-items:center;gap:5px;
  background:var(--panel);border:1px solid var(--line);border-radius:999px;
  padding:8px 14px;font:inherit;font-size:14px;font-weight:600;color:var(--text);
  cursor:pointer;backdrop-filter:blur(4px);
}
.chip b{font-variant-numeric:tabular-nums}
.chip:disabled{opacity:.45;cursor:default}
.chip:focus-visible{outline:2px solid #fff;outline-offset:2px}
.chip.armed{border-color:#ff7ad9;color:#ff7ad9;box-shadow:0 0 12px rgba(255,122,217,.45)}
#chipRapid.on{border-color:#ffe14d;color:#ffe14d;box-shadow:0 0 12px rgba(255,225,77,.4)}
#chipShield.on{border-color:#4dd6c1;color:#4dd6c1;box-shadow:0 0 12px rgba(77,214,193,.4)}
/* 타이틀 / 게임오버 오버레이 */
.overlay{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:12px;text-align:center;
  background:rgba(5,8,20,.74);backdrop-filter:blur(3px);border-radius:14px;padding:24px;
}
.overlay.hidden{display:none}
.overlay h1{margin:0;font-size:clamp(28px,5vw,44px);letter-spacing:.04em;text-shadow:0 4px 24px rgba(255,193,51,.25)}
.overlay p{margin:0;color:var(--muted);font-size:14px;line-height:1.7}
.stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 18px;font-size:14px;color:var(--muted)}
.stat b{display:block;font-size:22px;color:var(--accent);margin-top:2px}
.btn{
  cursor:pointer;border:0;border-radius:999px;padding:12px 30px;
  font:inherit;font-size:16px;font-weight:700;color:#201603;
  background:linear-gradient(180deg,#ffe08a,#ffc233);
  box-shadow:0 6px 18px rgba(255,194,51,.35);
}
.btn:hover{filter:brightness(1.07)}
.btn:focus-visible{outline:2px solid #fff;outline-offset:3px}
.hint{font-size:13px}
#overCountdown b{color:var(--accent);font-variant-numeric:tabular-nums}
kbd{
  font:inherit;font-size:12px;background:rgba(255,255,255,.1);
  border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 7px;
}
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="960" height="600" aria-label="유성 슬링샷 게임 화면"></canvas>

  <div id="hud">
    <div class="pill">점수<b id="scoreVal">0</b></div>
    <div class="pill">웨이브<b id="waveVal">1</b></div>
    <div class="pill">난이도<b id="diffVal">보통</b></div>
    <div class="pill">마을<b id="hpVal">100%</b><span class="vbar" aria-hidden="true"><span class="vfill" id="hpFill"></span></span></div>
    <div class="pill hidden" id="comboPill">콤보<b id="comboVal">x2</b></div>
  </div>

  <div id="itemBar" class="hidden">
    <button class="chip" id="chipRapid" type="button" title="획득하면 일정 시간 자동 발동됩니다">⚡ 연사<b id="rapidVal"></b></button>
    <button class="chip" id="chipHoming" type="button">🎯 100%<b id="homingVal">×0</b></button>
    <button class="chip" id="chipShield" type="button">🛡️ 보호막<b id="shieldVal">×0</b></button>
  </div>

  <button id="muteBtn" type="button" aria-label="음소거" aria-pressed="false" title="소리 켜기/끄기 (M)">🔊</button>

  <section class="overlay" id="titleOverlay" aria-label="게임 시작 화면">
    <h1>☄️ 유성 슬링샷</h1>
    <p>하늘에서 떨어지는 유성이 마을에 닿기 전에 요격하세요!<br>
       발사하고 싶은 곳을 <b>클릭</b>하면 그 지점을 향해 포물선으로 발사됩니다.</p>
    <button class="btn" id="startBtn">게임 시작</button>
    <p class="hint"><kbd>Space</kbd> 시작 · <kbd>R</kbd> 재시작 · <kbd>M</kbd> 소리 · <kbd>1</kbd> 조준 준비 · <kbd>2</kbd> 보호막</p>
  </section>

  <section class="overlay hidden" id="overOverlay" aria-label="게임 오버 화면">
    <h1>마을이 무너졌습니다…</h1>
    <div class="stats">
      <div class="stat">최종 점수<b id="finalScore">0</b></div>
      <div class="stat">최고 콤보<b id="bestCombo">x0</b></div>
      <div class="stat">도달 웨이브<b id="finalWave">1</b></div>
    </div>
    <button class="btn" id="retryBtn">다시 시작</button>
    <p class="hint" id="overCountdown">⏳ <b id="overCountdownVal">15</b>초 후 대기 화면으로 전환됩니다</p>
    <p class="hint"><kbd>Space</kbd> 또는 <kbd>R</kbd>로도 재시작할 수 있어요</p>
  </section>
</div>
